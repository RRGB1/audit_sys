[project]
name = "audit-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RRGB1", email = "robirozen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
audit-sys = "audit_sys:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]